<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capsule Hub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <img src="../../icons/icon48.png" alt="" class="logo-icon">
        <h1>Capsule Hub</h1>
      </div>
      <div class="privacy-badge">🔒 100% Local</div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Status Section -->
      <div class="status-section" id="status-section">
        <div class="status-icon">⚡</div>
        <div class="status-text" id="status-text">Detecting conversation...</div>
      </div>

      <!-- Action Buttons -->
      <div class="action-section">
        <button class="btn btn-primary btn-large" id="btn-save-capsule">
          <span class="btn-icon">💊</span>
          <span>Save Capsule</span>
        </button>
        
        <button class="btn btn-secondary" id="btn-copy-context">
          <span class="btn-icon">📋</span>
          <span>Copy Context</span>
        </button>
      </div>

      <!-- Capsule Library -->
      <div class="library-section">
        <div class="library-header">
          <h2>Capsule Library</h2>
          <span class="library-count" id="library-count">0 capsules</span>
        </div>

        <!-- Search -->
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Search capsules...">
        </div>

        <!-- Capsule List -->
        <div class="capsule-list" id="capsule-list">
          <div class="empty-state" id="empty-state">
            <div class="empty-icon">📦</div>
            <p>No capsules saved yet</p>
            <p class="empty-hint">Save your first capsule to get started</p>
          </div>
        </div>
      </div>

      <!-- Manual Entry (Collapsible) -->
      <details class="manual-section">
        <summary class="manual-summary">
          <span>✏️ Manual Entry</span>
          <span class="manual-arrow">▼</span>
        </summary>
        <div class="manual-content">
          <textarea id="manual-text" placeholder="Paste your context here..."></textarea>
          <button class="btn btn-primary btn-full" id="btn-manual">Load Context</button>
        </div>
      </details>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span class="footer-text">Context compression for AI workflows</span>
      <span class="footer-version">v1.3.0</span>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
